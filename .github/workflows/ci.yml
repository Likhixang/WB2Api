name: Test and publish multi-arch image
on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: wb2api-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest -q
      - run: docker compose config --quiet
        env:
          WB2API_ADMIN_KEY: ci-management-key-not-a-real-secret
          WB2API_API_KEY: ci-inference-key-not-a-real-secret
          WB2API_BIND_ADDRESS: 127.0.0.1
          WB2API_PORT: 8080
  image:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and publish both architectures
        uses: docker/build-push-action@v6
        id: build
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ghcr.io/likhixang/wb2api:latest,ghcr.io/likhixang/wb2api:sha-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: true
      - name: Verify manifest and run published image
        env:
          IMAGE: ghcr.io/likhixang/wb2api@${{ steps.build.outputs.digest }}
        run: |
          docker buildx imagetools inspect "$IMAGE" --raw > manifest.json
          python -c "import json; m=json.load(open('manifest.json')); a={x['platform']['architecture'] for x in m['manifests'] if x.get('platform',{}).get('os')=='linux'}; assert {'amd64','arm64'} <= a, a; print('Verified architectures:',sorted(a))"
          docker pull "$IMAGE"
          docker tag "$IMAGE" ghcr.io/likhixang/wb2api:latest
          export WB2API_ADMIN_KEY=ci-management-key-not-a-real-secret
          export WB2API_API_KEY=ci-inference-key-not-a-real-secret
          export WB2API_BIND_ADDRESS=127.0.0.1 WB2API_PORT=8080
          docker compose up -d --no-build --pull never
          trap 'docker compose logs; docker compose down' EXIT
          for n in $(seq 1 20); do
            if curl -fsS http://127.0.0.1:8080/healthz > health.json; then break; fi
            sleep 2
          done
          python -c "import json; assert json.load(open('health.json'))['status']=='ok'"
          curl -fsS http://127.0.0.1:8080/ | grep -q WB2Api
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8080/admin/api/status)" = 401
          docker inspect wb2api --format '{{.Config.User}}' | grep -q '10001:10001'
      - name: Image summary
        run: |
          printf '## WB2Api image\n- `ghcr.io/likhixang/wb2api:latest`\n- Digest: `${{ steps.build.outputs.digest }}`\n- Platforms: `linux/amd64`, `linux/arm64`\n' >> "$GITHUB_STEP_SUMMARY"
